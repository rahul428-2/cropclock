<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="891" viewBox="0 0 1440 891" font-family="-apple-system, system-ui, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="1440" height="940" fill="#fcfcfb"/><text x="40" y="52" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="start">CropClock — solution architecture</text><text x="40" y="80" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">Decides which agricultural feeder is energised, and when, from crop water demand, the rain forecast and the feeder&#x27;s own solar output.</text><text x="40" y="124" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">1  Data in</text><text x="330" y="124" font-size="12.5" font-weight="500" fill="#898781" text-anchor="end">free, no account</text><line x1="40" y1="134" x2="330" y2="134" stroke="#c3c2b7"/><text x="380" y="124" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">2  Crop water layer</text><text x="680" y="124" font-size="12.5" font-weight="500" fill="#898781" text-anchor="end">per feeder, daily</text><line x1="380" y1="134" x2="680" y2="134" stroke="#c3c2b7"/><text x="730" y="124" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="start">3  Decision engine</text><text x="1060" y="124" font-size="12.5" font-weight="500" fill="#898781" text-anchor="end">re-plans every day</text><line x1="730" y1="134" x2="1060" y2="134" stroke="#c3c2b7"/><text x="1110" y="124" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">4  Delivery</text><line x1="1110" y1="134" x2="1400" y2="134" stroke="#c3c2b7"/><rect x="40" y="150" width="290" height="111" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="56" y="178" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Sentinel-2 L2A</text><text x="56" y="200" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Element84 Earth Search (AWS)</text><text x="56" y="219" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">10 m red + NIR + scene class</text><text x="56" y="238" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">every ~5 days</text><rect x="251.60000000000002" y="162" width="68.4" height="20" rx="10" fill="#2a78d6"/><text x="285.8" y="176" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">live data</text><rect x="40" y="279" width="290" height="92" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="56" y="307" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Weather archive</text><text x="56" y="329" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Open-Meteo ERA5: observed rain,</text><text x="56" y="348" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">FAO-56 ET₀, hourly irradiance</text><rect x="251.60000000000002" y="291" width="68.4" height="20" rx="10" fill="#2a78d6"/><text x="285.8" y="305" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">live data</text><rect x="40" y="389" width="290" height="111" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="56" y="417" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Forecasts as issued</text><text x="56" y="439" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">rain 1–2 days ahead,</text><text x="56" y="458" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">irradiance day ahead</text><text x="56" y="477" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">(Open-Meteo previous-runs)</text><rect x="251.60000000000002" y="401" width="68.4" height="20" rx="10" fill="#2a78d6"/><text x="285.8" y="415" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">live data</text><rect x="40" y="518" width="290" height="111" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6 5"/><text x="56" y="546" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Feeder register</text><text x="56" y="568" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">command area, pumps, MSKVY</text><text x="56" y="587" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">solar MW, substation limit</text><text x="56" y="606" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">prototype: 8 × 500 ha, approx.</text><rect x="264.8" y="530" width="55.199999999999996" height="20" rx="10" fill="#6b6a66"/><text x="292.4" y="544" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">planned</text><rect x="380" y="150" width="300" height="111" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="396" y="178" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Cloud mask → NDVI</text><text x="396" y="200" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">drop cloud, shadow, cirrus pixels</text><text x="396" y="219" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">mean NDVI per feeder, each pass</text><text x="396" y="238" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">28 clear passes in rabi 2025-26</text><rect x="628.0" y="162" width="42.0" height="20" rx="10" fill="#0c7a3e"/><text x="649.0" y="176" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">built</text><rect x="380" y="287" width="300" height="111" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="396" y="315" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Crop coefficient</text><text x="396" y="337" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Kc = 1.457 · NDVI − 0.1725</text><text x="396" y="356" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">interpolated daily between passes</text><text x="396" y="375" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">monsoon cloud → FAO-56 stages</text><rect x="628.0" y="299" width="42.0" height="20" rx="10" fill="#0c7a3e"/><text x="649.0" y="313" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">built</text><rect x="380" y="424" width="300" height="111" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="396" y="452" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Soil water balance</text><text x="396" y="474" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">deficit += Kc · ET₀ − 0.8 · rain</text><text x="396" y="493" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">irrigate at 80 mm (50% of TAW)</text><text x="396" y="512" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">FAO-56, per feeder</text><rect x="628.0" y="436" width="42.0" height="20" rx="10" fill="#0c7a3e"/><text x="649.0" y="450" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">built</text><rect x="730" y="150" width="330" height="111" rx="10" fill="#f3f7fd" stroke="#2a78d6" stroke-width="1.5"/><text x="746" y="178" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Rain-skip</text><text x="746" y="200" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">≥15 mm forecast in next 48 h → defer</text><text x="746" y="219" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">never past 75% of soil capacity</text><text x="746" y="238" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">scored against rain that fell</text><rect x="1008.0" y="162" width="42.0" height="20" rx="10" fill="#0c7a3e"/><text x="1029.0" y="176" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">built</text><rect x="730" y="287" width="330" height="168" rx="10" fill="#f3f7fd" stroke="#2a78d6" stroke-width="1.5"/><text x="746" y="315" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Feeder scheduler (greedy)</text><text x="746" y="337" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">need kWh = deficit ÷ 0.6 efficiency</text><text x="746" y="356" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">1  sunniest forecast hours first</text><text x="746" y="375" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">2  most water-stressed feeders first</text><text x="746" y="394" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">3  ≤ 4 feeders on (substation cap)</text><text x="746" y="413" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">4  every feeder keeps 8 h/day</text><text x="746" y="432" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">5  overflow → hours nearest daylight</text><rect x="1008.0" y="299" width="42.0" height="20" rx="10" fill="#0c7a3e"/><text x="1029.0" y="313" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">built</text><rect x="730" y="481" width="330" height="73" rx="10" fill="#f3f7fd" stroke="#2a78d6" stroke-width="1.5"/><text x="746" y="509" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">24 h × feeder switching plan</text><text x="746" y="531" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">published 48 h ahead</text><rect x="1110" y="150" width="290" height="92" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1126" y="178" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">DISCOM switching</text><text x="1126" y="200" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">plan sent to substation /</text><text x="1126" y="219" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">RDSS smart-feeder SCADA</text><rect x="1334.8" y="162" width="55.199999999999996" height="20" rx="10" fill="#6b6a66"/><text x="1362.4" y="176" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">planned</text><rect x="1110" y="268" width="290" height="92" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1126" y="296" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Farmer notice</text><text x="1126" y="318" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">SMS / IVR in Marathi:</text><text x="1126" y="337" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">&quot;your feeder runs 09–17&quot;</text><rect x="1341.4" y="280" width="48.599999999999994" height="20" rx="10" fill="#b06a00"/><text x="1365.7" y="294" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">mocked</text><rect x="1110" y="386" width="290" height="92" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="1126" y="414" font-size="15.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Dashboard</text><text x="1126" y="436" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">deficit map, schedule vs rota,</text><text x="1126" y="455" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">savings — live on GitHub Pages</text><rect x="1348.0" y="398" width="42.0" height="20" rx="10" fill="#0c7a3e"/><text x="1369.0" y="412" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">built</text><path d="M330,205.5 L380,205.5" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M530,261 L530,287" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M530,398 L530,424" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M330,325.0 L362,325.0 L362,454 L380,454" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M330,444.5 L345,444.5 L345,663 L715,663 L715,237 L730,237" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M330,573.5 L345,573.5" fill="none" stroke="#898781" stroke-width="1.6"/><path d="M715,371.0 L730,371.0" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><text x="400" y="655" font-size="12" font-weight="500" fill="#898781" text-anchor="start">rain + sun forecasts · feeder limits</text><path d="M680,479.5 L697,479.5 L697,205.5 L730,205.5" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M895,261 L895,287" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M895,455 L895,481" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M1060,517.5 L1085,517.5 L1085,196.0 L1110,196.0" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M1085,314.0 L1110,314.0" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><path d="M1085,432.0 L1110,432.0" fill="none" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="703" width="1360" height="132" rx="12" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="60" y="733" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Backtest: 8 feeders, rabi 2025-26, real satellite passes, weather and forecasts — vs the MSEDCL day/night rota</text><text x="60.0" y="781" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start">−24.8%</text><text x="60.0" y="807" font-size="13.5" font-weight="500" fill="#52514e" text-anchor="start">grid energy (663 MWh)</text><text x="390.0" y="781" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start">₹49.7 lakh</text><text x="390.0" y="807" font-size="13.5" font-weight="500" fill="#52514e" text-anchor="start">subsidy avoided, one season</text><text x="720.0" y="781" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start">50.6% → 15.2%</text><text x="720.0" y="807" font-size="13.5" font-weight="500" fill="#52514e" text-anchor="start">pumping at night</text><text x="1050.0" y="781" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start">41.9% → 56.3%</text><text x="1050.0" y="807" font-size="13.5" font-weight="500" fill="#52514e" text-anchor="start">pump energy from solar</text><rect x="40" y="851" width="42.0" height="20" rx="10" fill="#0c7a3e"/><text x="61.0" y="865" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">built</text><text x="90.0" y="865" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">in the prototype</text><rect x="225.2" y="851" width="48.599999999999994" height="20" rx="10" fill="#b06a00"/><text x="249.5" y="865" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">mocked</text><text x="281.79999999999995" y="865" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">message designed, no gateway</text><rect x="497.4" y="851" width="55.199999999999996" height="20" rx="10" fill="#6b6a66"/><text x="525.0" y="865" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">planned</text><text x="560.6" y="865" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">needs DISCOM integration</text><rect x="749.4" y="851" width="68.4" height="20" rx="10" fill="#2a78d6"/><text x="783.6" y="865" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">live data</text><text x="825.8" y="865" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">public source</text><text x="1400" y="865" font-size="12.5" font-weight="500" fill="#898781" text-anchor="end">github.com/rahul428-2/cropclock</text></svg>